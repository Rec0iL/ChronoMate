<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <title>ChronoMate</title>
  <desc>ChronoMate logo: glowing chrono rings, a white BB and the CM lettering. Every part is its own named group so it can be animated on its own.</desc>
