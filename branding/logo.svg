      <stop offset="0.82" stop-color="#5a0c02"/>
      <stop offset="0.91" stop-color="#5a0c02" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5a0c02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-hot" gradientUnits="userSpaceOnUse" x1="420" y1="430" x2="1620" y2="1630">
