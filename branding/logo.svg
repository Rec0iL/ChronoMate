    <filter id="f-ring-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2048">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="f-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2048">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-letter-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2048">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7" result="b"/>
      <feFlood flood-color="#ffc290" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
