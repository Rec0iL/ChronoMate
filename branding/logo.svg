    </linearGradient>
    <linearGradient id="ring-white" gradientUnits="userSpaceOnUse" x1="760" y1="780" x2="1000" y2="1280">
      <stop offset="0" stop-color="#fff3e2"/>
      <stop offset="0.6" stop-color="#ffe2c0"/>
      <stop offset="1" stop-color="#ffb47a"/>
    </linearGradient>
    <linearGradient id="g-ray">
